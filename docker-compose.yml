services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apothecary
      POSTGRES_PASSWORD: apothecary_local
      POSTGRES_DB: apothecary
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apothecary -d apothecary']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: apothecary
      DB_PASSWORD: apothecary_local
      DB_NAME: apothecary
      DB_SSL: 'false'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: